<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3人の自己紹介</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-8">
    <main class="max-w-4x1 mx-auto px-4">
        <h1 class="text-2x1 font-bold text-gray-900 mb-6 text-center">弓道のメンバー</h1>

        <div class="flex flex-col md:flex-row gap-4 w-full justify-center">

            <div class="bg-white rounded-lg shadow p-6 flex flex-col item-center w-30">
                <span class="text-4x1 text-center">😼</span>
                <h2 class="text-lg font-bold text-gray-900 mt-3 text-center">和部 なづき</h2>
                <h3 class="text-gray-600 text-normal mt-2 text-center">大前</h3>
                <p class="text-gray-600 text-sm mt-2 text-center">全体の流れをつかむ</p>
            </div>

            <div class="bg-white rounded-lg shadow p-6 flex flex-col item-center w-30">
                <span class="text-4x1 text-center">😾</span>
                <h2 class="text-lg font-bold text-gray-900 mt-3 text-center">浦田 藍</h2>
                <h3 class="text-gray-600 text-normal mt-2 text-center">中</h3>
                <p class="text-gray-600 text-sm mt-2 text-center">流れを安定させる</p>
            </div>

            <div class="bg-white rounded-lg shadow p-6 flex flex-col item-center w-30">
                <span class="text-4x1 text-center">😹</span>
                <h2 class="text-lg font-bold text-gray-900 mt-3 text-center">山部 依織</h2>
                <h3 class="text-gray-600 text-normal mt-2 text-center">落</h3>
                <p class="text-gray-600 text-sm mt-2 text-center">最後の締めくくり</p>
            </div>
        </div>
    </main>
</body>
</html>

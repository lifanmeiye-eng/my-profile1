<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファッション</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-50">
    <header class="bg-gray-100 shadow px-6 py-4">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <h1 class="text-xl font-bold text-blue-700">ファッションセンター</h1>
        <nav class="hidden md:flex flex-col md:flex-row gap-2 md:gap-6 text-sm">
          <a href="#" class="text-gray-700 hover:text-blue-600">ホーム</a>
          <a href="#" class="text-gray-700 hover:text-blue-600">商品内容</a>
          <a href="#" class="text-gray-700 hover:text-blue-600">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">

      <section class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">トレンド商品を手に取りやすい価格で</h2>
        <p class="text-gray-600">私たちは学生にファッションを楽しんでほしいと考えています。</p>
      </section>


      <section class="mb-10">
        <h2 class="text-xl font-bold mb-4">商品内容</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow p-4 hover:bg-gray-200 transition-colors duration-300">
            <p class="text-2xl mb-2">👕</p>
            <h3 class="font-bold">トップス</h3>
            <p class="text-gray-500 text-sm mt-1">人気ブランドのトップス</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:bg-gray-200 transition-colors duration-300">
            <p class="text-2xl mb-2">👖</p>
            <h3 class="font-bold">ボトムス</h3>
            <p class="text-gray-500 text-sm mt-1">最新トレンドのボトムス</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:bg-gray-200 transition-colors duration-300"
          <p class="text-2xl mb-2">🧣</p>
            <h3 class="font-bold">アイテム</h3>
            <p class="text-gray-500 text-sm mt-1">1アイテムで楽しめる</p>
          </div>
        </div>
      </section>

    </main>


    <footer class="bg-gray-800 text-gray-400 text-sm text-center py-6">
    &copy; 2025 ファッションセンター. All rights reserved.
    </footer>

</body>
</html>

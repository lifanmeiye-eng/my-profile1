<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week04 商品一覧</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white-100 p-6">
    <h1 class="text-2xl font-bold mb-6">冬の必須商品一覧</h1>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">🎅</div>
            <h2 class="text-lg font-semibold">ニット帽</h2>
            <p class="text-gray-600">頭からの防寒</p>
            <p class="text-xl font-bold text-green-500">¥300</p>
        </div>
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">🧤</div>
            <h2 class="text-lg font-semibold">手袋</h2>
            <p class="text-gray-600">手を温めて心も温かく</p>
            <p class="text-xl font-bold text-green-500">¥500</p>
        </div>
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">🧣</div>
            <h2 class="text-lg font-semibold">マフラー</h2>
            <p class="text-gray-600 ">北風にも耐えれる</p>
            <p class="text-xl font-bold text-green-500">¥500</p>
        </div>
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">👕</div>
            <h2 class="text-lg font-semibold">ヒートインナー</h2>
            <p class="text-gray-600">これがないと冬越せない</p>
            <p class="text-xl font-bold text-green-500">¥1,000</p>
        </div>
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">🧥</div>
            <h2 class="text-lg font-semibold">ダッフルコート</h2>
            <p class="text-gray-600">寒い冬でも暖かく過ごせる</p>
            <p class="text-xl font-bold text-green-500">¥3,000</p>
        </div>
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">👢</div>
            <h2 class="text-lg font-semibold">ブーツ</h2>
            <p class="text-gray-600">足先も暖かく</p>
            <p class="text-xl font-bold text-green-500">¥2,000</p>
        </div>
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">👂</div>
            <h2 class="text-lg font-semibold">イヤーマフ</h2>
            <p class="text-gray-600">耳を温めて冬を快適に</p>
            <p class="text-xl font-bold text-green-500">¥800</p>
        </div>
        <div class="bg-blue-100 rounded-lg shadow-md p-4 hover:bg-blue-200 transition-colors duration-300">
            <div class="text-4xl mb-2">💂🏻</div>
            <h2 class="text-lg font-semibold">ニット</h2>
            <p class="text-gray-600">冬でもおしゃれしたい</p>
            <p class="text-xl font-bold text-green-500">¥1,200</p>
        </div>
    </div>
   

</body>
</html>
